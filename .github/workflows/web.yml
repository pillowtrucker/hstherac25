name: web
# Builds the VT100 console for the browser (vt100/build-web.sh) and reproduces the Tyler accident
# in the WebAssembly build. Then builds therac25-console.zip (vt100/package-web.sh): the same site
# under neutral names, to host anywhere, attached to the run as a plain zip.
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SOURCE_URL    repository URL for the page's footer; unset, the page names no repository
#   DEPLOY_PAGES  "true" to also publish pushes to main on GitHub Pages
#                 (then also Settings -> Pages -> Source: GitHub Actions)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GHC's WebAssembly toolchain
        run: |
          curl -sSf https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | FLAVOUR=9.12 sh
          ~/.ghc-wasm/add_to_github_path.sh

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm/.cabal/packages
            ~/.ghc-wasm/.cabal/store
          key: wasm-9.12-${{ hashFiles('hstherac25.cabal') }}
          restore-keys: wasm-9.12-

      - name: Build
        env:
          SOURCE_URL: ${{ vars.SOURCE_URL }}
        run: |
          wasm32-wasi-cabal update
          vt100/build-web.sh

      - name: Reproduce the Tyler accident in the browser build
        run: node vt100/test/smoke.mjs vt100/dist

      - name: Package the console under neutral names
        run: vt100/package-web.sh

      - name: Reproduce the Tyler accident in the packaged console
        run: node vt100/test/smoke.mjs vt100/package/therac25-console

      - uses: actions/upload-artifact@v7
        with:
          path: vt100/package/therac25-console.zip
          archive: false

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        with:
          path: vt100/dist

  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
